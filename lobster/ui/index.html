<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🦞 Tiny Lobster WebUI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #ff4757;
            --accent-hover: #ff6b81;
            --accent-green: #238636;
            --accent-yellow: #d29922;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        }
        html, body {
            height: 100%;
            height: 100dvh;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100%;
            width: 100%;
            position: relative;
        }

        /* Sidebar Drawer */
        .sidebar {
            width: 300px;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 20;
            transition: transform 0.2s ease;
        }
        .header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-bottom: 2px solid transparent;
        }
        .tab.active {
            color: #fff;
            border-bottom: 2px solid var(--accent);
            font-weight: bold;
        }
        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .item-card {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.78rem;
            word-break: break-word;
        }
        .item-card.pending {
            border-left: 3px solid var(--accent-yellow);
        }
        .item-card.completed {
            border-left: 3px solid #2ea043;
        }
        .item-card.cancelled {
            border-left: 3px solid var(--text-muted);
        }

        /* Main Chat Area */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-width: 0;
            background: var(--bg);
        }
        .top-bar {
            display: none;
            padding: 10px 14px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            align-items: center;
            justify-content: space-between;
        }
        .menu-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* Approval Banner */
        .approval-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px 14px 0 14px;
        }
        .approval-card {
            background: #1c140e;
            border: 1px solid #9e6a03;
            border-left: 4px solid var(--accent-yellow);
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .approval-header {
            color: var(--accent-yellow);
            font-weight: bold;
            font-size: 0.82rem;
        }
        .approval-desc {
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 8px;
            font-family: monospace;
            font-size: 0.78rem;
            color: #fff;
            word-break: break-all;
            white-space: pre-wrap;
        }
        .approval-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .btn-allow {
            background: var(--accent-green);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: bold;
        }
        .btn-deny {
            background: #da3633;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: bold;
        }

        /* Chat Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .msg-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 88%;
        }
        .msg-group.user {
            align-self: flex-end;
        }
        .msg-group.lobster {
            align-self: flex-start;
        }

        .msg {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-break: break-word;
        }
        .msg.user {
            background: var(--accent);
            color: #fff;
        }
        .msg.user p {
            margin-bottom: 8px;
        }
        .msg.user p:last-child {
            margin-bottom: 0;
        }
        .msg.user code:not(pre code) {
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 0.82rem;
            font-family: monospace;
        }

        .msg.lobster {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 100%;
        }

        /* Markdown Elements */
        .msg.lobster h1, .msg.lobster h2, .msg.lobster h3 {
            margin: 10px 0 4px 0;
            color: #fff;
        }
        .msg.lobster p {
            margin-bottom: 8px;
        }
        .msg.lobster p:last-child {
            margin-bottom: 0;
        }
        .msg.lobster ul, .msg.lobster ol {
            margin-left: 20px;
            margin-bottom: 8px;
        }
        .msg.lobster li {
            margin-bottom: 3px;
        }
        .msg.lobster code:not(pre code) {
            background: #21262d;
            color: #f0883e;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 0.82rem;
            font-family: monospace;
        }

        .code-wrapper {
            position: relative;
            margin: 8px 0;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .code-wrapper pre {
            margin: 0;
            padding: 12px;
            background: #0d1117 !important;
            overflow-x: auto;
            font-size: 0.8rem;
        }
        .copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #21262d;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.72rem;
            cursor: pointer;
            user-select: none;
        }
        .copy-btn:hover {
            color: #fff;
            border-color: var(--text-muted);
        }

        .msg.lobster table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 0.82rem;
        }
        .msg.lobster th, .msg.lobster td {
            border: 1px solid var(--border);
            padding: 6px 10px;
            text-align: left;
        }
        .msg.lobster th {
            background: rgba(255,255,255,0.05);
            font-weight: bold;
            color: #fff;
        }

        /* Debug Tool Dropdown */
        .debug-bubble {
            background: #13171f;
            border: 1px solid #30363d;
            border-left: 3px solid var(--accent-yellow);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.78rem;
            margin-bottom: 4px;
        }
        .debug-bubble summary {
            outline: none;
            cursor: pointer;
            color: var(--accent-yellow);
            font-weight: 600;
        }
        .debug-content {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-family: monospace;
        }
        .debug-step {
            background: #0d1117;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid #21262d;
        }
        .debug-step .title {
            color: #58a6ff;
            font-weight: bold;
            margin-bottom: 3px;
            font-size: 0.75rem;
        }
        .debug-step pre {
            white-space: pre-wrap;
            word-break: break-word;
            color: #c9d1d9;
            font-size: 0.72rem;
        }

        /* Typing Dots */
        .typing-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 16px;
        }
        .typing-dot {
            width: 4px;
            height: 4px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: pulse 1s infinite alternate;
        }
        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes pulse {
            from {
                opacity: 0.3;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Input Bar */
        .input-bar {
            padding: 12px;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        textarea#userInput {
            flex: 1;
            min-width: 0;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
            resize: none;
            height: 44px;
            max-height: 140px;
            line-height: 1.4;
        }
        textarea#userInput:focus {
            border-color: var(--accent);
        }
        button.send-btn {
            height: 44px;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:disabled {
            opacity: 0.5;
        }

        /* Mobile Sliding Drawer */
        @media (max-width: 768px) {
            .top-bar {
                display: flex;
            }
            #sidebarCloseBtn {
                display: inline-block !important;
            }

            .sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                width: 85vw;
                max-width: 320px;
                height: 100%;
                transform: translateX(-100%);
                box-shadow: none;
                transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 100;
            }

            .sidebar.open {
                transform: translateX(0);
                box-shadow: 4px 0 24px rgba(0, 0, 0, 0.8);
            }

            .overlay {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.6);
                backdrop-filter: blur(2px);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.25s ease;
                z-index: 90;
            }

            .overlay.open {
                opacity: 1;
                pointer-events: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

        <div id="sidebar" class="sidebar">
            <div class="header">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span>🦞 Tiny Lobster</span>
                    <span style="font-size: 0.75rem; color: #2ea043;">● Active</span>
                </div>
                <button class="menu-btn" onclick="toggleMenu()" style="display: none;" id="sidebarCloseBtn">✕</button>
            </div>
            <div class="tabs">
                <div class="tab active" onclick="switchTab('tasks')">Tasks</div>
                <div class="tab" onclick="switchTab('facts')">Memory</div>
                <div class="tab" onclick="switchTab('tools')">Tools</div>
            </div>
            <div id="tab-tasks" class="tab-content"></div>
            <div id="tab-facts" class="tab-content" style="display:none;"></div>
            <div id="tab-tools" class="tab-content" style="display:none;"></div>
        </div>

        <div class="main">
            <div class="top-bar">
                <button class="menu-btn" onclick="toggleMenu()">☰ Menu</button>
                <span style="font-size: 0.85rem; font-weight: bold; color: var(--accent);">🦞 Lobster Chat</span>
            </div>

            <div id="approvalBox" class="approval-container" style="display: none;"></div>
            <div class="messages" id="chat"></div>

            <div class="input-bar">
                <textarea id="userInput" placeholder="Type a message..."></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMsg()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let activeTab = 'tasks';
        const inputArea = document.getElementById('userInput');

        inputArea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 140) + 'px';
        });

        // Event delegation for copy buttons
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.copy-btn');
            if (!btn) return;

            const wrapper = btn.closest('.code-wrapper');
            if (!wrapper) return;

            const codeEl = wrapper.querySelector('pre code') || wrapper.querySelector('pre');
            const text = codeEl ? codeEl.innerText : '';

            const showCopied = () => {
                btn.textContent = 'Copied!';
                setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(showCopied).catch(() => fallbackCopy(text, showCopied));
            } else {
                fallbackCopy(text, showCopied);
            }
        });

        function fallbackCopy(text, cb) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.top = '-9999px';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try {
                document.execCommand('copy');
                if (cb) cb();
            } catch (err) {
                console.error('Fallback copy failed', err);
            }
            document.body.removeChild(ta);
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        function switchTab(t) {
            activeTab = t;
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            if (event && event.target) event.target.classList.add('active');
            document.getElementById('tab-' + t).style.display = 'block';
            refreshSidebar();
        }

        function renderMarkdown(rawText) {
            const html = marked.parse(rawText || '');
            const temp = document.createElement('div');
            temp.innerHTML = html;

            temp.querySelectorAll('pre code').forEach(el => {
                hljs.highlightElement(el);
                const pre = el.parentElement;
                const wrapper = document.createElement('div');
                wrapper.className = 'code-wrapper';

                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.type = 'button';
                btn.textContent = 'Copy';

                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(btn);
                wrapper.appendChild(pre);
            });
            return temp.innerHTML;
        }

        function appendMsg(role, text, debugData = null) {
            const chat = document.getElementById('chat');
            const group = document.createElement('div');
            group.className = 'msg-group ' + role;

            if (debugData) {
                let events = Array.isArray(debugData) ? debugData : [debugData];
                if (events.length > 0) {
                    const debug = document.createElement('details');
                    debug.className = 'debug-bubble';
                    const tools = [...new Set(events.map(d => d.tool || d.name || 'tool'))].join(', ');
                    let innerHTML = `<summary>⚡ Tool Execution [${tools}]</summary><div class="debug-content">`;

                    events.forEach(ev => {
                        const toolName = ev.tool || ev.name || 'unknown';
                        const args = ev.args !== undefined ? ev.args : ev.arguments;

                        if (ev.type === 'call') {
                            const hasArgs = args && typeof args === 'object' && Object.keys(args).length > 0;
                            innerHTML += `
                            <div class="debug-step">
                                <div class="title">▶ Call: ${toolName}</div>
                                ${hasArgs ? `<pre>${JSON.stringify(args, null, 2)}</pre>` : '<span style="color:#8b949e;font-size:0.7rem;">(No args)</span>'}
                            </div>`;
                        } else if (ev.type === 'result') {
                            const outputStr = typeof ev.output === 'object' ? JSON.stringify(ev.output, null, 2) : (ev.output ?? '');
                            innerHTML += `
                            <div class="debug-step">
                                <div class="title" style="color:#7ee787;">✔ Result: ${toolName}</div>
                                <pre>${outputStr}</pre>
                            </div>`;
                        }
                    });
                    innerHTML += `</div>`;
                    debug.innerHTML = innerHTML;
                    group.appendChild(debug);
                }
            }

            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.innerHTML = renderMarkdown(text);

            group.appendChild(div);
            chat.appendChild(group);
            chat.scrollTop = chat.scrollHeight;
        }

        async function loadChatHistory() {
            try {
                const res = await fetch('/api/history');
                const history = await res.json();
                const chat = document.getElementById('chat');
                chat.innerHTML = '';
                history.forEach(item => {
                    if (item.text) appendMsg(item.role, item.text, item.debug);
                });
            } catch (e) {
                console.error('Failed to load history:', e);
            }
        }

        async function sendMsg() {
            const msg = inputArea.value.trim();
            const btn = document.getElementById('sendBtn');
            if (!msg) return;

            appendMsg('user', msg);
            inputArea.value = '';
            inputArea.style.height = '44px';
            btn.disabled = true;

            const chat = document.getElementById('chat');
            const group = document.createElement('div');
            group.className = 'msg-group lobster';

            const debugDetails = document.createElement('details');
            debugDetails.className = 'debug-bubble';
            debugDetails.style.display = 'none';
            debugDetails.innerHTML = `<summary>⚡ Tool Execution</summary><div class="debug-content"></div>`;
            group.appendChild(debugDetails);

            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg lobster';
            msgDiv.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
            group.appendChild(msgDiv);
            chat.appendChild(group);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';
                let fullText = '';
                let isDone = false;

                while (!isDone) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    const lines = buffer.split('\n\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const event = JSON.parse(line.replace('data: ', ''));

                        if (event.type === 'call') {
                            debugDetails.style.display = 'block';
                            debugDetails.open = true;
                            const content = debugDetails.querySelector('.debug-content');
                            content.innerHTML += `
                            <div class="debug-step">
                                <div class="title">▶ Call: ${event.tool}</div>
                                <pre>${JSON.stringify(event.args, null, 2)}</pre>
                            </div>`;
                        } else if (event.type === 'result') {
                            const content = debugDetails.querySelector('.debug-content');
                            const outStr = typeof event.output === 'object' ? JSON.stringify(event.output, null, 2) : event.output;
                            content.innerHTML += `
                            <div class="debug-step">
                                <div class="title" style="color:#7ee787;">✔ Result: ${event.tool}</div>
                                <pre>${outStr}</pre>
                            </div>`;
                        } else if (event.type === 'text') {
                            fullText = event.content || '';
                            msgDiv.innerHTML = renderMarkdown(fullText);
                        } else if (event.type === 'error') {
                            msgDiv.textContent = 'Error: ' + event.content;
                            isDone = true;
                            break;
                        } else if (event.type === 'done') {
                            isDone = true;
                            break;
                        }
                        chat.scrollTop = chat.scrollHeight;
                    }
                }
            } catch(e) {
                msgDiv.textContent = 'Error: ' + e;
            } finally {
                btn.disabled = false;
                refreshSidebar();
            }
        }

        async function checkApprovals() {
            try {
                const res = await fetch('/api/approvals');
                if (!res.ok) return;
                const pending = await res.json();
                const box = document.getElementById('approvalBox');

                if (!pending || pending.length === 0) {
                    box.style.display = 'none';
                    box.innerHTML = '';
                    return;
                }

                box.style.display = 'flex';
                box.innerHTML = pending.map(item => `
                    <div class="approval-card">
                        <div class="approval-header"><span>⚠️ Action Requires Confirmation</span></div>
                        <div class="approval-desc">${item.action}</div>
                        <div class="approval-actions">
                            <button class="btn-deny" onclick="resolveApproval('${item.id}', false)">✕ Deny</button>
                            <button class="btn-allow" onclick="resolveApproval('${item.id}', true)">✓ Allow Action</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Approval poll error:', err);
            }
        }

        async function resolveApproval(id, decision) {
            try {
                await fetch('/api/approve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, decision: decision })
                });
                checkApprovals();
            } catch (err) {
                console.error('Approval resolution error:', err);
            }
        }

        async function refreshSidebar() {
            if (activeTab === 'tasks') {
                const res = await fetch('/api/tasks');
                const tasks = await res.json();
                const container = document.getElementById('tab-tasks');
                container.innerHTML = tasks.length === 0 ? '<p style="color:var(--text-muted);font-size:0.8rem;">No tasks.</p>' : '';
                tasks.slice().reverse().forEach(t => {
                    container.innerHTML += `
                    <div class="item-card ${t.status}">
                        <strong>${t.id}</strong> [${t.status}]<br>
                        ${t.description}<br>
                        <small style="color:var(--text-muted)">Next: ${t.next_run || 'N/A'}</small>
                    </div>`;
                });
            } else if (activeTab === 'facts') {
                const res = await fetch('/api/facts');
                const data = await res.json();
                const container = document.getElementById('tab-facts');

                let html = `
                <div style="font-size:0.75rem;margin-bottom:12px;padding:8px;background:rgba(46,160,67,0.1);border:1px solid #238636;border-radius:6px;color:#3fb950;display:flex;align-items:center;gap:6px;">
                    <span>🧠</span>
                    <span><strong>${data.history_message_count || 0}</strong> total messages indexed</span>
                </div>
                `;

                const facts = data.facts || {};
                const categories = Object.keys(facts);

                if (categories.length === 0) {
                    html += `<p style="color:var(--text-muted);font-size:0.8rem;text-align:center;padding:20px 0;">No saved memory facts yet.</p>`;
                } else {
                    categories.forEach(category => {
                        html += `
                        <div class="memory-group" style="margin-bottom:12px;">
                            <div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--accent-yellow);font-weight:bold;margin-bottom:6px;padding-left:2px;">
                                📁 ${category}
                            </div>
                            <div style="display:flex;flex-direction:column;gap:6px;">
                        `;

                        const entries = facts[category];
                        if (typeof entries === 'object' && entries !== null) {
                            Object.entries(entries).forEach(([key, val]) => {
                                const valText = typeof val === 'object' ? JSON.stringify(val) : val;
                                html += `
                                <div class="item-card" style="margin-bottom:0;border-left:3px solid var(--accent-yellow);">
                                    <div style="color:var(--text-muted);font-size:0.7rem;font-weight:600;margin-bottom:2px;">${key}</div>
                                    <div style="color:#fff;font-size:0.8rem;line-height:1.4;">${valText}</div>
                                </div>
                                `;
                            });
                        } else {
                            html += `
                            <div class="item-card" style="margin-bottom:0;border-left:3px solid var(--accent-yellow);">
                                <div style="color:#fff;font-size:0.8rem;">${entries}</div>
                            </div>
                            `;
                        }

                        html += `</div></div>`;
                    });
                }
                container.innerHTML = html;
            } else if (activeTab === 'tools') {
                const res = await fetch('/api/tools');
                const tools = await res.json();
                const container = document.getElementById('tab-tools');
                container.innerHTML = '';
                tools.forEach(tool => {
                    container.innerHTML += `
                    <div class="item-card">
                        <strong>🔧 ${tool.name}</strong><br>
                        <small style="color:var(--text-muted)">${tool.description || ''}</small>
                    </div>`;
                });
            }
        }

        loadChatHistory();
        setInterval(checkApprovals, 1000);
        setInterval(refreshSidebar, 5000);
        refreshSidebar();
    </script>
</body>
</html>
